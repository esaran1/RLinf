# Unitree G1 (29 DOF) + Inspire -- piston pick-place.
#
# The simulator is external: it lives in `unitree_sim_isaaclab` with the
# `g1_redball_eval` overlay registering the piston task IDs. RLinf only adapts it
# (see rlinf/envs/isaaclab/tasks/g1_piston.py).
#
# num_envs is pinned to 1: the upstream termination term `reset_object_estimate`
# is scalar-valued and raises for batched tensors. Do not raise this without
# vectorizing that term upstream first.

env_type: isaaclab
total_num_envs: 1
auto_reset: False
ignore_terminations: False
use_rel_reward: True
seed: 0
group_size: 1

reward_coef: 1.0
use_fixed_reset_state_ids: False
# Budgets are in ENV steps, not policy actions: step() increments _elapsed_steps once
# per env step and truncates on max_episode_steps. The simulator runs at 100 Hz
# (sim.dt 0.005 * decimation 2) and episode_length_s stays 20.0 -> 2000 env steps
# = 1000 policy actions at 50 Hz. Demonstrations run 13.1-14.0 s, so this leaves ~6 s
# of headroom. Do not raise it, and do not halve episode_length_s to compensate for
# the zero-order hold.
max_steps_per_rollout_epoch: 2000
max_episode_steps: 2000

video_cfg:
  save_video: False
  info_on_video: True
  fps: 20
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "Isaac-PickPlace-Piston-G129-Inspire-Joint"
  num_envs: 1
  max_episode_steps: ${..max_episode_steps}
  # Path to the external unitree_sim_isaaclab checkout, prepended to sys.path in
  # the simulator subprocess so its top-level `tasks` package registers the IDs.
  unitree_sim_path: "/home/jren313/unitree_sim_isaaclab"
  # VERBATIM from the SFT handoff (RLINF_INTERFACE.json task_string), verified against
  # sha256 23c5ab23b8e8f7a903580bb14b32706c438100989ed45293e2415d87238e8062. Lowercase
  # 'pick', trailing period. Any rewording is out of distribution -- do not edit.
  task_description: "pick up the piston with the right hand, inject it into the tube held by the left hand, then move it over the hole plate."
  # NOTE: camera resolution/optics are deliberately NOT overridden here. The piston
  # scene cfg in unitree_sim_isaaclab now configures front_camera as the D435 color
  # stream (424x240, focal 14.55 mm -> 69.0 deg HFOV) to match the training data.
  # Overriding height/width here would silently change the vertical FOV, because
  # VFOV depends on the aspect ratio. Leave these unset.
  #
  # The policy consumes exactly one image (ego_view == front_camera). The wrist
  # cameras are not used by the policy, the reward, or any termination, so they are
  # disabled during evaluation to save simulator VRAM.
  enable_wrist_cameras: false
  # Fail fast if the ego camera's optics drift from the dataset's D435 (69 deg HFOV).
  verify_ego_optics: true
  # Zero-order hold: the policy runs at 50 Hz, the simulator at 100 Hz, so each of the
  # 30 predicted actions is applied for 2 consecutive env steps. This is a boundary
  # rate conversion only -- action_horizon stays 30 and num_action_chunks stays 30.
  action_hold_steps: 2
